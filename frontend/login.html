<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravLog CRM Login</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="left">

        <div class="overlay">

            <h1>TravLog CRM</h1>

            <p>
                Travel Quotation Management System
            </p>

        </div>

    </div>

    <div class="right">

        <form id="loginForm">

            <h2>Welcome Back 👋</h2>

            <p>Login to Continue</p>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button>

                Login

            </button>

            <p id="message"></p>

        </form>

    </div>

</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/login.js?v=2"></script>

</body>

</html>
