<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create New Quote</title>

<link rel="stylesheet" href="assets/css/create-quote.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="header">

<h2>Create New Quote</h2>

<div class="quoteNo">

Quote No :
<strong id="quoteNumber">TLN26875</strong>

</div>

</div>

<div class="steps">

<div class="step active">1. Country</div>

<div class="step">2. Passenger</div>

<div class="step">3. Cities</div>

<div class="step">4. Nights</div>

<div class="step">5. Hotels</div>

<div class="step">6. Tours</div>

<div class="step">7. Transfers</div>

<div class="step">8. Pricing</div>

<div class="step">9. Preview</div>

<div class="step">10. PDF</div>

</div>

<div class="card">

<h3>Destination Details</h3>

<div class="grid">

<div>

<label>Country</label>

<select>

<option>Select Country</option>

<option>Thailand</option>

<option>Vietnam</option>

<option>Dubai</option>

<option>Singapore</option>

<option>Bali</option>

</select>

</div>

<div>

<label>Travel Date</label>

<input type="date">

</div>

<div>

<label>Total Passengers</label>

<input type="number">

</div>

<div>

<label>Total Nights</label>

<input type="number">

</div>

</div>

</div>

<div class="buttons">

<button class="back">

Dashboard

</button>

<button class="next">

Next →

</button>

</div>

</div>

</body>

</html>
